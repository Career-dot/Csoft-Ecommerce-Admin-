<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSOFT | Products</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="products" data-title="Products" data-path="pages">

<div id="toast-container"></div>
<div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

<div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <div class="main-content">
        <header class="topbar" id="topbar-mount"></header>

        <main class="page-content">

            <div class="flex-between flex-wrap gap-16">
                <div>
                    <h2 class="page-title">All Products</h2>
                    <p class="text-muted">Manage your product catalog</p>
                </div>
                <a href="add-product.html" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Product
                </a>
            </div>

            <div class="card">
                <div class="table-toolbar">
                    <div class="table-tabs" id="status-tabs">
                        <button class="active" data-status="All">All</button>
                        <button data-status="Active">Active</button>
                        <button data-status="Low Stock">Low Stock</button>
                        <button data-status="Out of Stock">Out of Stock</button>
                    </div>
                    <div class="flex gap-12 flex-wrap">
                        <div class="table-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="product-search" placeholder="Search by name or SKU...">
                        </div>
                        <div class="table-filters">
                            <select id="category-filter">
                                <option value="All">All Categories</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th data-sort="name">Product <span class="sort-arrow">↕</span></th>
                                <th data-sort="category">Category <span class="sort-arrow">↕</span></th>
                                <th data-sort="price">Price <span class="sort-arrow">↕</span></th>
                                <th data-sort="stock">Stock <span class="sort-arrow">↕</span></th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body"></tbody>
                    </table>
                </div>

                <div class="pagination">
                    <span id="pagination-info"></span>
                    <div class="pagination-buttons" id="pagination-buttons"></div>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- ===================== VIEW PRODUCT MODAL ===================== -->
<div class="modal-overlay" id="view-product-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Product Details</h3>
            <button class="modal-close" onclick="closeModal('view-product-modal')">&times;</button>
        </div>
        <div id="view-product-body"></div>
    </div>
</div>

<!-- ===================== EDIT PRODUCT MODAL ===================== -->
<div class="modal-overlay" id="edit-product-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Edit Product</h3>
            <button class="modal-close" onclick="closeModal('edit-product-modal')">&times;</button>
        </div>
        <form id="edit-product-form">
            <input type="hidden" id="edit-product-id">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="edit-product-name">Product Name</label>
                    <input type="text" id="edit-product-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-product-price">Price ($)</label>
                    <input type="number" id="edit-product-price" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="edit-product-stock">Stock</label>
                    <input type="number" id="edit-product-stock" min="0" required>
                </div>
                <div class="form-group full-width">
                    <label for="edit-product-status">Status</label>
                    <select id="edit-product-status">
                        <option>Active</option>
                        <option>Low Stock</option>
                        <option>Out of Stock</option>
                        <option>Inactive</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('edit-product-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/products.js"></script>
</body>
</html>
