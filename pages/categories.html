<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSOFT | Categories</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="categories" data-title="Categories" data-path="pages">

<div id="toast-container"></div>
<div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

<div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <div class="main-content">
        <header class="topbar" id="topbar-mount"></header>

        <main class="page-content">

            <div class="flex-between flex-wrap gap-16">
                <div>
                    <h2 class="page-title">Categories</h2>
                    <p class="text-muted">Organize your products into categories</p>
                </div>
                <button class="btn btn-primary" id="add-category-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Category
                </button>
            </div>

            <div class="card">
                <div class="table-toolbar">
                    <div class="table-search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="category-search" placeholder="Search categories...">
                    </div>
                </div>

                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Category Name</th>
                                <th>Products</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categories-table-body"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- ===================== ADD / EDIT CATEGORY MODAL ===================== -->
<div class="modal-overlay" id="category-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="category-modal-title">Add Category</h3>
            <button class="modal-close" onclick="closeModal('category-modal')">&times;</button>
        </div>
        <form id="category-form">
            <input type="hidden" id="category-id">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="category-name">Category Name <span class="required">*</span></label>
                    <input type="text" id="category-name" placeholder="e.g. Smartphones">
                    <span class="field-error" id="category-name-error"></span>
                </div>
                <div class="form-group full-width">
                    <label for="category-status">Status</label>
                    <select id="category-status">
                        <option>Active</option>
                        <option>Inactive</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('category-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Category</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/categories.js"></script>
</body>
</html>
