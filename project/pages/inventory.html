<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSOFT | Inventory</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="inventory" data-title="Inventory" data-path="pages">

<div id="toast-container"></div>
<div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

<div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <div class="main-content">
        <header class="topbar" id="topbar-mount"></header>

        <main class="page-content">

            <div>
                <h2 class="page-title">Inventory</h2>
                <p class="text-muted">Monitor stock levels across your catalog</p>
            </div>

            <section class="stat-cards">
                <div class="stat-card">
                    <div class="stat-label">Available Stock</div>
                    <div class="stat-value" id="summary-available" style="color:var(--success);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Low Stock Alerts</div>
                    <div class="stat-value" id="summary-low" style="color:var(--warning);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Out of Stock</div>
                    <div class="stat-value" id="summary-out" style="color:var(--danger);">0</div>
                </div>
            </section>

            <div class="card">
                <div class="table-toolbar">
                    <div class="table-tabs" id="inventory-tabs">
                        <button class="active" data-level="All">All Items</button>
                        <button data-level="Available">Available</button>
                        <button data-level="Low Stock">Low Stock</button>
                        <button data-level="Out of Stock">Out of Stock</button>
                    </div>
                </div>

                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Current Stock</th>
                                <th>Reorder Level</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- ===================== UPDATE STOCK MODAL ===================== -->
<div class="modal-overlay" id="update-stock-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Update Stock</h3>
            <button class="modal-close" onclick="closeModal('update-stock-modal')">&times;</button>
        </div>
        <form id="update-stock-form">
            <input type="hidden" id="update-stock-product-id">
            <p class="text-muted" style="margin-bottom:14px;">Updating stock for <strong id="update-stock-name"></strong></p>
            <div class="form-group full-width">
                <label for="update-stock-amount">New Stock Quantity</label>
                <input type="number" id="update-stock-amount" min="0" required>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('update-stock-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Update Stock</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/inventory.js"></script>
</body>
</html>
