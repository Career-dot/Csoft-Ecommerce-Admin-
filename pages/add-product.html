<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSOFT | Add Product</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="add-product" data-title="Add Product" data-path="pages">

<div id="toast-container"></div>
<div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

<div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <div class="main-content">
        <header class="topbar" id="topbar-mount"></header>

        <main class="page-content">

            <div>
                <h2 class="page-title">Add New Product</h2>
                <p class="text-muted">Fill in the details below to add a product to your catalog</p>
            </div>

            <div class="card">

                <div class="form-success-msg" id="add-form-success">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    Product added successfully!
                </div>

                <form id="add-product-form" novalidate>
                    <div class="form-grid">

                        <div class="form-group full-width">
                            <label for="add-product-name">Product Name <span class="required">*</span></label>
                            <input type="text" id="add-product-name" placeholder="e.g. iPhone 15 Pro">
                            <span class="field-error" id="add-product-name-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="add-product-category">Category <span class="required">*</span></label>
                            <select id="add-product-category">
                                <option value="">Select category</option>
                            </select>
                            <span class="field-error" id="add-product-category-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="add-product-sku">SKU <span class="required">*</span></label>
                            <input type="text" id="add-product-sku" placeholder="e.g. APL-IP15P-256">
                            <span class="field-error" id="add-product-sku-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="add-product-price">Price ($) <span class="required">*</span></label>
                            <input type="number" id="add-product-price" min="0" step="0.01" placeholder="0.00">
                            <span class="field-error" id="add-product-price-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="add-product-stock">Stock Quantity <span class="required">*</span></label>
                            <input type="number" id="add-product-stock" min="0" placeholder="0">
                            <span class="field-error" id="add-product-stock-error"></span>
                        </div>

                        <div class="form-group full-width">
                            <label for="add-product-description">Description</label>
                            <textarea id="add-product-description" placeholder="Short description of the product..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>Status</label>
                            <select id="add-product-status">
                                <option>Active</option>
                                <option>Low Stock</option>
                                <option>Out of Stock</option>
                                <option>Inactive</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Product Image</label>
                            <div class="image-upload-box" id="image-upload-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                <p><strong>Click to upload</strong> or drag and drop</p>
                            </div>
                            <input type="file" id="add-product-image" accept="image/*" class="hidden">
                            <img id="add-image-preview" class="image-preview" alt="Preview">
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="reset" class="btn btn-secondary">Reset</button>
                        <button type="submit" class="btn btn-primary">Submit Product</button>
                    </div>
                </form>
            </div>

        </main>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/products.js"></script>
</body>
</html>
