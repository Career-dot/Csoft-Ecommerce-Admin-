<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSOFT | Discounts</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/topbar.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="discounts" data-title="Discounts" data-path="pages">

<div id="toast-container"></div>
<div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

<div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <div class="main-content">
        <header class="topbar" id="topbar-mount"></header>

        <main class="page-content">

            <div class="flex-between flex-wrap gap-16">
                <div>
                    <h2 class="page-title">Discounts &amp; Coupons</h2>
                    <p class="text-muted">Create and manage promotional coupons</p>
                </div>
                <button class="btn btn-primary" id="add-discount-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Create Coupon
                </button>
            </div>

            <div class="card">
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Type</th>
                                <th>Value</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="discounts-table-body"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!--  CREATE COUPON MODAL  -->
<div class="modal-overlay" id="discount-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Create Coupon</h3>
            <button class="modal-close" onclick="closeModal('discount-modal')">&times;</button>
        </div>
        <form id="discount-form">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="discount-code">Coupon Code <span class="required">*</span></label>
                    <input type="text" id="discount-code" placeholder="e.g. SUMMER25">
                    <span class="field-error" id="discount-code-error"></span>
                </div>
                <div class="form-group">
                    <label for="discount-type">Discount Type</label>
                    <select id="discount-type">
                        <option value="Percentage">Percentage</option>
                        <option value="Flat">Flat Amount</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="discount-value">Value <span class="required">*</span></label>
                    <input type="number" id="discount-value" min="0" placeholder="e.g. 25">
                    <span class="field-error" id="discount-value-error"></span>
                </div>
                <div class="form-group full-width">
                    <label for="discount-expiry">Expiry Date <span class="required">*</span></label>
                    <input type="date" id="discount-expiry">
                    <span class="field-error" id="discount-expiry-error"></span>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('discount-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Coupon</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/discounts.js"></script>
</body>
</html>
